name: CI

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, develop ]
  release:
    types: [ published ]
  workflow_dispatch:

env:
  PICO_BOARD: pico2
  PICO_SDK_VERSION: 2.3.0
  DOTNET_VERSION: '10.0.x'

jobs:
  # ============================================================
  # 固件构建（Ubuntu + ARM GCC + Pico SDK）
  # ============================================================
  firmware:
    name: Firmware (RP2350)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # --------------------------------------------------------
    # 1. 安装系统依赖
    # --------------------------------------------------------
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          gcc-arm-none-eabi \
          libnewlib-arm-none-eabi \
          git

    # --------------------------------------------------------
    # 2. 拉取 Pico SDK
    # --------------------------------------------------------
    - name: Clone Pico SDK
      run: |
        git clone --depth 1 --branch $PICO_SDK_VERSION \
          https://github.com/raspberrypi/pico-sdk.git $HOME/pico-sdk
        cd $HOME/pico-sdk
        git submodule update --init --depth 1
      env:
        PICO_SDK_VERSION: ${{ env.PICO_SDK_VERSION }}

    # --------------------------------------------------------
    # 3. 代码格式检查（clang-format）
    # --------------------------------------------------------
    - name: Check code format
      run: |
        sudo apt-get install -y clang-format
        cd firmware
        find src include -name "*.c" -o -name "*.h" | sort > /tmp/files.txt
        echo "Checking $(wc -l < /tmp/files.txt) files..."
        clang-format --dry-run --Werror --style=file $(cat /tmp/files.txt) 2>&1 | tee /tmp/format-result.txt
        if [ $? -ne 0 ]; then
          echo "Code format check failed!"
          exit 1
        fi
        echo "All files formatted correctly"
      continue-on-error: true

    # --------------------------------------------------------
    # 4. 构建固件
    # --------------------------------------------------------
    - name: Build firmware
      run: |
        export PICO_SDK_PATH=$HOME/pico-sdk
        cd firmware
        mkdir -p build
        cd build
        cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
        ninja

    # --------------------------------------------------------
    # 5. 验证固件大小
    # --------------------------------------------------------
    - name: Check firmware size
      run: |
        UF2_FILE=firmware/build/pico_hid_composite.uf2
        if [ -f "$UF2_FILE" ]; then
          SIZE_KB=$(du -k "$UF2_FILE" | cut -f1)
          echo "Firmware size: ${SIZE_KB} KB"
          if [ $SIZE_KB -gt 1536 ]; then
            echo "Warning: Firmware size exceeds 1.5MB!"
          fi
        else
          echo "Error: Firmware file not found!"
          exit 1
        fi

    # --------------------------------------------------------
    # 6. 上传固件产物
    # --------------------------------------------------------
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-rp2350
        path: |
          firmware/build/pico_hid_composite.uf2
          firmware/build/pico_hid_composite.elf
          firmware/build/pico_hid_composite.bin
          firmware/build/pico_hid_composite.hex
          firmware/build/pico_hid_composite.map

    # --------------------------------------------------------
    # 7. 上传到 GitHub Releases（打 Tag 或发布时）
    # --------------------------------------------------------
    - name: Upload firmware to Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
      with:
        files: |
          firmware/build/pico_hid_composite.uf2
          firmware/build/pico_hid_composite.elf
          firmware/build/pico_hid_composite.bin
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 上位机构建（Windows + .NET 10 + WPF）
  # ============================================================
  pc-tool:
    name: PC Tool (Windows / .NET 10)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # --------------------------------------------------------
    # 1. 设置 .NET SDK
    # --------------------------------------------------------
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # --------------------------------------------------------
    # 2. 缓存 NuGet 包
    # --------------------------------------------------------
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('pc_tool/**/*.csproj') }}
        restore-keys: |
          nuget-

    # --------------------------------------------------------
    # 3. 调试：列出目录结构
    # --------------------------------------------------------
    - name: List directory structure
      run: |
        Get-ChildItem -Path pc_tool -Recurse -Depth 2 | Select-Object FullName

    # --------------------------------------------------------
    # 4. 还原依赖
    # --------------------------------------------------------
    - name: Restore dependencies
      run: dotnet restore pc_tool/HidConfigTool.slnx

    # --------------------------------------------------------
    # 5. 构建
    # --------------------------------------------------------
    - name: Build
      run: dotnet build pc_tool/HidConfigTool.slnx --configuration Release --no-restore

    # --------------------------------------------------------
    # 6. 运行单元测试
    # --------------------------------------------------------
    - name: Run unit tests
      run: dotnet test pc_tool/src/HidConfigTool.Tests/HidConfigTool.Tests.csproj --configuration Release --verbosity normal
      continue-on-error: true

    # --------------------------------------------------------
    # 7. 发布上位机（依赖框架）
    # --------------------------------------------------------
    - name: Publish PC Tool (framework-dependent)
      run: |
        dotnet publish pc_tool/src/HidConfigTool.App/HidConfigTool.App.csproj `
          --configuration Release `
          --self-contained false `
          --output publish-framework-dependent

    # --------------------------------------------------------
    # 8. 发布上位机（自包含单文件）
    # --------------------------------------------------------
    - name: Publish PC Tool (self-contained single-file)
      run: |
        dotnet publish pc_tool/src/HidConfigTool.App/HidConfigTool.App.csproj `
          --configuration Release `
          --self-contained true `
          --runtime win-x64 `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          --output publish-self-contained
      continue-on-error: true

    # --------------------------------------------------------
    # 8. 上传产物
    # --------------------------------------------------------
    - name: Upload PC Tool (framework-dependent)
      uses: actions/upload-artifact@v4
      with:
        name: pc-tool-windows-framework-dependent
        path: publish-framework-dependent/

    - name: Upload PC Tool (self-contained)
      uses: actions/upload-artifact@v4
      with:
        name: pc-tool-windows-self-contained
        path: publish-self-contained/
      continue-on-error: true

    # --------------------------------------------------------
    # 9. 打包并上传到 Releases（打 Tag 或发布时）
    # --------------------------------------------------------
    - name: Package PC Tool for Release
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
      shell: pwsh
      run: |
        $releaseDir = "release-packages"
        New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

        if (Test-Path "publish-framework-dependent") {
          Compress-Archive -Path "publish-framework-dependent\*" -DestinationPath "$releaseDir\pc-tool-windows-framework-dependent.zip" -Force
          Write-Host "Packaged: framework-dependent"
        }

        if (Test-Path "publish-self-contained") {
          Compress-Archive -Path "publish-self-contained\*" -DestinationPath "$releaseDir\pc-tool-windows-self-contained.zip" -Force
          Write-Host "Packaged: self-contained"
        }

    - name: Upload PC Tool to Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
      with:
        files: |
          release-packages/*.zip
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 文档检查
  # ============================================================
  docs:
    name: Docs Check
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check documentation files
      run: |
        echo "Checking documentation files..."
        for f in README.md CHANGELOG.md docs/*.md; do
          if [ -f "$f" ]; then
            echo "✅ $f"
          else
            echo "⚠️  $f not found"
          fi
        done
